apiVersion: apps/v1
kind: Deployment
metadata:
  name: rest
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rest
  template:
    metadata:
      labels:
        app: rest
    spec:
      containers:
        - name: rest-server
          image: joezski/rest-server:v1
          ports:
            - containerPort: 5000

# containerPort must match the targetPort from the service file